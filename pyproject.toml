[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria"
version = "0.1.0"
description = "Proyectos, agentes, skills, contextos, sesiones y memorias de Claude Code en MariaDB"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyMySQL>=1.1", "PyYAML>=6.0", "mcp>=2.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
memoria = "memoria.__main__:main"
memoria-mcp = "memoria.mcp_server:main"
memoria-api = "memoria.api:main"
memoria-mcp-http = "memoria.mcp_http:main"

[tool.setuptools]
packages = ["memoria"]

[tool.setuptools.package-data]
memoria = ["sql/*.sql"]
